name: 🚀 编译 (Build) - ImmortalWrt 24.10.4 for AX3000T

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库（openwrt-24.10 分支）
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'openwrt-24.10'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 切换到 24.10.4 commit（e717d133ed6d）
        working-directory: ImmortalWrt
        run: |
          git checkout e717d133ed6d
          echo "✅ 已锁定到 commit: $(git rev-parse --short HEAD)"

      # ========== 手动克隆第三方插件到 package/ 目录 ==========
      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      # ========== quickstart 已移除（刷机后通过 opkg 安装） ==========

      - name: 复制配置文件到 ImmortalWrt
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds（仅官方源）
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 再次复制配置文件（确保 .config 不被覆盖）
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      # ========== 第一次锁定：defconfig 后强制写入 ==========
      - name: 强制锁定设备类型为 xiaomi_mi-router-ax3000t（第一次锁定）
        working-directory: ImmortalWrt
        run: |
          make defconfig
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y" >> .config
          make defconfig
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型被重置！"
            exit 1
          fi
          echo "✅ 第一次锁定：设备类型已锁定为 xiaomi_mi-router-ax3000t"
          grep "CONFIG_TARGET_DEVICE" .config || true

      # ========== 第二次锁定：编译前最后强制覆盖 ==========
      - name: 编译前最后强制锁定设备类型（第二次锁定）
        working-directory: ImmortalWrt
        run: |
          echo "🔄 第二次锁定：编译前最后强制覆盖设备类型..."
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y" >> .config
          make oldconfig
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：第二次锁定失败！"
            exit 1
          fi
          echo "✅ 第二次锁定：设备类型最终确认为 xiaomi_mi-router-ax3000t"
          grep "CONFIG_TARGET_DEVICE" .config || true

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.4_AX3000T
          path: ImmortalWrt/bin/targets

  build-ssh:
    if: ${{inputs.ssh == true}}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-22.04
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库（openwrt-24.10 分支）
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'openwrt-24.10'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 切换到 24.10.4 commit（e717d133ed6d）
        working-directory: ImmortalWrt
        run: |
          git checkout e717d133ed6d
          echo "✅ 已锁定到 commit: $(git rev-parse --short HEAD)"

      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      - name: 复制配置文件
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 再次复制配置文件
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 强制锁定设备类型（第一次）
        working-directory: ImmortalWrt
        run: |
          make defconfig
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y" >> .config
          make defconfig
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型被重置！"
            exit 1
          fi
          echo "✅ 第一次锁定：设备类型已锁定为 xiaomi_mi-router-ax3000t"
          grep "CONFIG_TARGET_DEVICE" .config || true

      - name: 编译前最后强制锁定（第二次）
        working-directory: ImmortalWrt
        run: |
          echo "🔄 第二次锁定：编译前最后强制覆盖设备类型..."
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y" >> .config
          make oldconfig
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：第二次锁定失败！"
            exit 1
          fi
          echo "✅ 第二次锁定：设备类型最终确认为 xiaomi_mi-router-ax3000t"
          grep "CONFIG_TARGET_DEVICE" .config || true

      - name: 开启 SSH 服务
        uses: lhotari/action-upterm@v1
        with:
          wait-timeout-minutes: 20

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.4_AX3000T
          path: ImmortalWrt/bin/targets
