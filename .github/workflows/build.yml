name: 🚀 编译 (Build) - ImmortalWrt for AX3000T (官方 + MTK TurboACC)

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库（含自定义配置文件）
        uses: actions/checkout@v5

      # ========== 核心：克隆官方 ImmortalWrt 源码 ==========
      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      # ========== 校验 git 状态 ==========
      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      # ========== 手动集成 MedyMa 的 MTK 软件包（含 luci-app-turboacc-mtk 及驱动） ==========
      - name: 从 MedyMa 仓库复制 MTK 包目录
        working-directory: ImmortalWrt
        run: |
          # 使用 sparse checkout 只下载 package/mtk 目录
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MedyMa/immortalwrt-mt798x-6.6.git temp_mtk
          cd temp_mtk
          git sparse-checkout set package/mtk
          cd ..
          # 将整个 mtk 目录移动到 ImmortalWrt/package 下
          mv temp_mtk/package/mtk package/
          rm -rf temp_mtk
          echo "✅ MTK 软件包（含 luci-app-turboacc-mtk）已成功复制到 package/mtk"

      # ========== 手动添加 UA3F 源码 ==========
      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      # ========== 手动添加 OpenAppFilter (OAF) 源码 ==========
      - name: 克隆 OpenAppFilter (OAF) 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      # ========== 从 kenzok8 源拉取 quickstart 及其全部依赖 ==========
      - name: 从 kenzok8 源拉取 quickstart 及其全部依赖
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8
          echo "✅ quickstart 全部依赖链已拉取"

      # ========== 复制自定义配置文件 ==========
      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      # ========== 运行 diy.sh（如有自定义调整） ==========
      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      # ========== 更新并安装 feeds（包括官方 feeds） ==========
      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ========== 加载配置：合并 ax3000t.config 和 seed.config ==========
      - name: 加载 AX3000T 完整配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config
          
          # ----- 关闭 CONFIG_SHADOW_PASSWORDS（避免冲突） -----
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config
          
          # ----- 使用 oldconfig 处理依赖 -----
          yes "" | make oldconfig
          
          # ----- 再次确保 SHADOW_PASSWORDS 关闭 -----
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config
          
          # ----- 设备校验 -----
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：AX3000T‑ubootmod"
          grep "CONFIG_TARGET_DEVICE" .config || true

      - name: 编译前上传配置（便于调试）
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      # ========== 提取版本号 ==========
      - name: 编译后版本校验并提取版本信息
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          FW_TAG=$(git describe --tags)
          echo "FW_TAG=$FW_TAG"
          FW_VERSION=${FW_TAG#v}
          echo "FW_VERSION=$FW_VERSION" >> $GITHUB_ENV
          echo "✅ 提取版本号: $FW_VERSION"

          echo "==== profiles.json version ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_${{ env.FW_VERSION }}_AX3000T_MTK
          path: ImmortalWrt/bin/targets

  # ========== SSH 调试版本（与上述一致，增加 SSH） ==========
  build-ssh:
    if: ${{inputs.ssh == true}}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-22.04
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      - name: 从 MedyMa 仓库复制 MTK 包目录
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MedyMa/immortalwrt-mt798x-6.6.git temp_mtk
          cd temp_mtk
          git sparse-checkout set package/mtk
          cd ..
          mv temp_mtk/package/mtk package/
          rm -rf temp_mtk
          echo "✅ MTK 软件包已复制"

      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      - name: 克隆 OpenAppFilter (OAF) 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      - name: 从 kenzok8 源拉取 quickstart 及其全部依赖
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8
          echo "✅ quickstart 全部依赖链已拉取"

      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 加载 AX3000T 完整配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config
          
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config
          
          yes "" | make oldconfig
          
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config
          
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：AX3000T‑ubootmod"
          grep "CONFIG_TARGET_DEVICE" .config || true

      - name: 开启 SSH 服务（用于手动调试）
        uses: lhotari/action-upterm@v1
        with:
          wait-timeout-minutes: 20

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 编译后版本校验并提取版本信息
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          FW_TAG=$(git describe --tags)
          echo "FW_TAG=$FW_TAG"
          FW_VERSION=${FW_TAG#v}
          echo "FW_VERSION=$FW_VERSION" >> $GITHUB_ENV
