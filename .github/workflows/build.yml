name: 🚀 编译 (Build) - ImmortalWrt 24.10.4 for AX3000T

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库（openwrt-24.10 分支）
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'openwrt-24.10'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 切换到 24.10.4 commit（e717d133ed6d）
        working-directory: ImmortalWrt
        run: |
          git checkout e717d133ed6d
          echo "✅ 当前源码 commit: $(git rev-parse --verify HEAD)"

      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      # ========== 从 kenzok8 源补全 quickstart 全部依赖链 ==========
      - name: 从 kenzok8 源拉取 quickstart 及其全部依赖
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8
          echo "✅ quickstart 全部依赖链已拉取"

      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 加载 AX3000T 完整配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config
          yes "" | make oldconfig 2>/dev/null || true
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：AX3000T‑ubootmod + 24.10.4 软件包集合"

      # ========== 🔧 方案 B 最终修复：使用 scripts/config 官方工具 ==========
      - name: 注入 24.10.4 完整版本标识（使用 scripts/config 官方工具）
        working-directory: ImmortalWrt
        run: |
          # 使用 OpenWrt 自带工具设置字符串配置，替代 echo >> .config
          ./scripts/config --set-str CONFIG_VERSION_NUMBER "24.10.4"
          ./scripts/config --set-str CONFIG_VERSION_CODE "r33602-e717d133ed6d"
          ./scripts/config --set-str CONFIG_VERSION_REPO "https://downloads.immortalwrt.org/releases/24.10.4"
          # 同步配置，silentoldconfig 无交互，不会清理已设置好的 VERSION 字符串
          make silentoldconfig
          # 打印校验，日志中可直接查看是否写入成功
          grep CONFIG_VERSION_ .config

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.4_AX3000T
          path: ImmortalWrt/bin/targets

  build-ssh:
    if: ${{inputs.ssh == true}}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-22.04
    steps:
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库（openwrt-24.10 分支）
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'openwrt-24.10'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 切换到 24.10.4 commit（e717d133ed6d）
        working-directory: ImmortalWrt
        run: |
          git checkout e717d133ed6d
          echo "✅ 当前源码 commit: $(git rev-parse --verify HEAD)"

      - name: 手动克隆 UA3F 源码
        working-directory: ImmortalWrt
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      - name: 从 kenzok8 源拉取 quickstart 及其全部依赖
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8
          echo "✅ quickstart 全部依赖链已拉取"

      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 加载 AX3000T 完整配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config
          yes "" | make oldconfig 2>/dev/null || true
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：AX3000T‑ubootmod + 24.10.4 软件包集合"

      - name: 注入 24.10.4 完整版本标识（使用 scripts/config 官方工具）
        working-directory: ImmortalWrt
        run: |
          ./scripts/config --set-str CONFIG_VERSION_NUMBER "24.10.4"
          ./scripts/config --set-str CONFIG_VERSION_CODE "r33602-e717d133ed6d"
          ./scripts/config --set-str CONFIG_VERSION_REPO "https://downloads.immortalwrt.org/releases/24.10.4"
          make silentoldconfig
          grep CONFIG_VERSION_ .config

      - name: 开启 SSH 服务
        uses: lhotari/action-upterm@v1
        with:
          wait-timeout-minutes: 20

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.4_AX3000T
          path: ImmortalWrt/bin/targets
