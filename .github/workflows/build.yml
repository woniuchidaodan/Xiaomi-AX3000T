name: 🚀 编译 (Build) - ImmortalWrt for AX3000T

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ inputs.ssh == false }}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    steps:
      # ========== 安装编译依赖 ==========
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      # ========== 克隆当前仓库 ==========
      - name: 克隆当前仓库
        uses: actions/checkout@v5

      # ========== 克隆 ImmortalWrt 官方仓库 ==========
      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      # ========== 校验 git 版本标签 ==========
      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      # ========== 复制自定义配置文件 ==========
      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      # ========== 运行 diy.sh ==========
      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      # ========== 更新并下载 feeds ==========
      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ========== 加载设备配置（通用校验） ==========
      - name: 加载设备配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config

          # ----- 仅关闭 CONFIG_SHADOW_PASSWORDS -----
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          # ----- 使用 oldconfig 保护全局配置 -----
          yes "" | make oldconfig

          # ----- 再次确认 CONFIG_SHADOW_PASSWORDS 保持关闭 -----
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          # ----- 通用设备校验（只要 .config 中选中了任意 Target 即可） -----
          if ! grep -q "^CONFIG_TARGET_.*=y" .config; then
            echo "❌ 错误：未在 .config 中选中任何目标设备！"
            echo "请检查 ax3000t.config 或替换为其他设备的配置文件。"
            exit 1
          fi
          echo "✅ 已检测到目标设备配置："
          grep "^CONFIG_TARGET_.*=y" .config || true

      # ========== 设置构建日期（用于 Artifact 名称） ==========
      - name: 设置构建日期
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      # ========== 编译前上传配置 ==========
      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      # ========== 多线程编译 ==========
      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      # ========== 单线程编译 ==========
      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      # ========== 编译后版本校验 ==========
      - name: 编译后版本校验
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== profiles.json version ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      # ========== 上传编译结果 ==========
      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.6_AX3000T_${{ env.BUILD_DATE }}
          path: ImmortalWrt/bin/targets

  # ========== SSH 调试 Job（使用 tmate） ==========
  build-ssh:
    if: ${{ inputs.ssh == true }}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-22.04
    steps:
      # ========== 安装编译依赖 ==========
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      # ========== 克隆当前仓库 ==========
      - name: 克隆当前仓库
        uses: actions/checkout@v5

      # ========== 克隆 ImmortalWrt 官方仓库 ==========
      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      # ========== 校验 git 版本标签 ==========
      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      # ========== 复制自定义配置文件 ==========
      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      # ========== 运行 diy.sh ==========
      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      # ========== 更新并下载 feeds ==========
      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ========== 加载设备配置（通用校验） ==========
      - name: 加载设备配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          yes "" | make oldconfig

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          if ! grep -q "^CONFIG_TARGET_.*=y" .config; then
            echo "❌ 错误：未在 .config 中选中任何目标设备！"
            echo "请检查 ax3000t.config 或替换为其他设备的配置文件。"
            exit 1
          fi
          echo "✅ 已检测到目标设备配置："
          grep "^CONFIG_TARGET_.*=y" .config || true

      # ========== 设置构建日期（用于 Artifact 名称） ==========
      - name: 设置构建日期
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      # ========== 开启 SSH（tmate） ==========
      - name: 开启 SSH 服务（tmate）
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      # ========== 编译前上传配置 ==========
      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      # ========== 多线程编译 ==========
      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      # ========== 单线程编译 ==========
      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      # ========== 编译后版本校验 ==========
      - name: 编译后版本校验
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== profiles.json version ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      # ========== 上传编译结果 ==========
      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.6_AX3000T_${{ env.BUILD_DATE }}
          path: ImmortalWrt/bin/targets
