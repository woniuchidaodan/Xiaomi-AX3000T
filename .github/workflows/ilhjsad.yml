name: 🚀 编译 ImmortalWrt for AX3000T

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译 (Enable multithreading)'
        type: boolean
        default: true
      ssh:
        description: 'SSH 调试模式'
        type: boolean
        default: false
      isFiles:
        description: '使用 files 大法'
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 克隆当前仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义 feeds (diy-part1.sh)
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ========== 第三方插件克隆 ==========
    - name: 克隆 UA3F 源码
      working-directory: openwrt
      run: git clone https://github.com/SunBK201/UA3F.git package/UA3F

    - name: 克隆 OpenAppFilter (OAF) 源码
      working-directory: openwrt
      run: git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

    - name: 从 kenzok8 拉取 quickstart 及其依赖
      working-directory: openwrt
      run: |
        git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
        cd temp_kenzok8
        git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
        cd ..
        mv temp_kenzok8/quickstart package/
        mv temp_kenzok8/luci-app-quickstart package/
        mv temp_kenzok8/luci-app-store package/
        mv temp_kenzok8/luci-lib-taskd package/
        mv temp_kenzok8/luci-lib-xterm package/
        mv temp_kenzok8/taskd package/
        rm -rf temp_kenzok8
        echo "✅ quickstart 全部依赖链已拉取"

    - name: 加载自定义配置 (diy-part2.sh)
      run: |
        [ -e files ] && [ "${{inputs.isFiles}}" == "true" ] && cp -r files openwrt/files
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # ========== 加载 ax3000t-v6.6.config ==========
    - name: 加载配置文件
      working-directory: openwrt
      run: |
        if [ -f ../ax3000t-v6.6.config ]; then
          echo "✅ 使用配置文件 ax3000t-v6.6.config"
          cp ../ax3000t-v6.6.config .config
        else
          echo "❌ 错误：未找到 ax3000t-v6.6.config"
          echo "请确保仓库根目录存在此配置文件"
          exit 1
        fi
        make defconfig
        if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
          echo "❌ 设备未正确选中"
          grep "CONFIG_TARGET_DEVICE" .config || true
          exit 1
        fi
        echo "✅ 配置已加载"
        grep "CONFIG_TARGET_DEVICE" .config || true

    # ========== SSH 调试 ==========
    - name: SSH 连接 (tmate)
      if: ${{inputs.ssh == true}}
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true

    - name: SSH 模式提示
      if: ${{inputs.ssh == true}}
      run: |
        echo "========================================="
        echo "🔧 SSH 调试模式"
        echo "如需修改配置："
        echo "  cd openwrt"
        echo "  make menuconfig"
        echo "  make defconfig"
        echo "  cp .config ../ax3000t-v6.6.config"
        echo "  然后提交此文件到仓库"
        echo "========================================="

    # ========== 编译 ==========
    - name: 下载软件包
      if: ${{inputs.ssh == false}}
      working-directory: openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      if: ${{inputs.ssh == false}}
      id: compile
      working-directory: openwrt
      run: |
        echo -e "$(nproc) thread compile"
        if [ "${{inputs.multithreading}}" == "true" ]; then
          make VERSION_NUMBER="24.10.6" -j$(nproc) || make -j1 V=s
        else
          make VERSION_NUMBER="24.10.6" -j1 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    # ========== 整理产物 ==========
    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf *.buildinfo
        rm -rf *.manifest
        rm -rf *.json
        rm -rf *bl2.bin
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到 Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_AX3000T${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ========== 发布 Release ==========
    - name: 生成 Release 标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-ImmortalWrt-AX3000T" >> $GITHUB_OUTPUT
        cat > release.txt << 'EOF'
        # Xiaomi AX3000T 固件
        - 基于 padavanonly/immortalwrt-mt798x-6.6 编译
        - 内核版本：6.6
        - 后台地址：192.168.5.1
        - 账号：root
        - 密码：无

        ## 集成插件
        - quickstart (luci-app-quickstart)
        - UA3F (luci-app-ua3f)
        - OpenAppFilter (luci-app-oaf)
        - TurboACC MTK (luci-app-turboacc-mtk)
        - Argon 主题

        ## 注意事项
        - 刷机前请确认 U-Boot 类型
        - MTK U-Boot 布局 或 标准 U-Boot 布局
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布固件到 Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 清理历史运行记录（保留最近3次）
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3