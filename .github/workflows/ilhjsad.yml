name: 🚀 编译 immortalwrt(Build immortalwrt)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "openWRT 仓库的拥有者 (Owner of openWRT repo)"
        type: string
        required: true
        default: "padavanonly"
      repo:
        description: "openWRT 仓库的名字 (Name of openWRT repo)"
        type: string
        required: true
        default: "immortalwrt-mt798x-6.6"
      branch:
        description: "openWRT 仓库的分支 (Branch of openWRT repo)"
        type: string
        required: true
        default: "openwrt-24.10-6.6"
      multithreading:
        description: "开启多线程编译 (Enable multithreading build)"
        type: boolean
        default: true
      ssh:
        description: "使用 ssh 连接到编译环境 (Connect to the build environment using ssh)"
        type: boolean
        default: false
      isFiles:
        description: "使用files大法 (Whether to upload the etc files)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    steps:
      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          export TMPDIR=$RUNNER_TEMP
          sudo mkdir -p $TMPDIR
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/*
          sudo apt-get update -y

          sudo apt-get install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 openWRT 仓库 (Clone openWRT repo)
        uses: actions/checkout@v4
        with:
          repository: "${{inputs.owner}}/${{inputs.repo}}"
          ref: ${{inputs.branch}}
          path: openWRT

      - name: 复制当前仓库的自定义文件到 openWRT 仓库 (Copy custom files)
        run: cp -f diy.sh feeds.conf.default seed.config openWRT/

      - name: 如果选择了上传 files 大法，则复制 files 目录到 openWRT 仓库
        if: ${{inputs.isFiles == true}}
        run: cp -r files openWRT/files

      # ========== 手动克隆第三方插件 ==========
      - name: 手动克隆 UA3F 源码
        working-directory: openWRT
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      - name: 克隆 OpenAppFilter (OAF) 源码
        working-directory: openWRT
        run: |
          git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      - name: 从 kenzok8 源拉取 quickstart 及其全部依赖
        working-directory: openWRT
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8
          echo "✅ quickstart 全部依赖链已拉取"

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: openWRT
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: openWRT
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ========== SSH 连接（仅当 ssh 为 true 时执行） ==========
      - name: 使用ssh连接编译环境，限时15分钟，可在连接后输入命令 `touch /tmp/keepalive` 保活
        if: ${{inputs.ssh == true}}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      # ========== 配置加载（分两种情况） ==========
      # 情况一：非 SSH 模式，自动加载配置（如果有 manual 则使用，否则自动生成）
      - name: 加载配置（非 SSH 模式）
        if: ${{inputs.ssh == false}}
        working-directory: openWRT
        run: |
          if [ -f ../ax3000t-manual.config ]; then
            echo "✅ 使用手动生成的配置 ax3000t-manual.config"
            cp ../ax3000t-manual.config .config
          else
            echo "⚠️ 未找到手动配置，使用自动生成"
            make defconfig
            cat > mini.config << 'EOF'
            CONFIG_TARGET_mediatek=y
            CONFIG_TARGET_mediatek_filogic=y
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-mtkuboot=y
            # CONFIG_SHADOW_PASSWORDS is not set
            EOF
            make KCONFIG_ALLCONFIG=mini.config defconfig
            grep '^CONFIG_PACKAGE_' ../seed.config | grep -v 'kmod-' >> .config || true
            make defconfig
          fi

          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型未正确选中！"
            grep "CONFIG_TARGET_DEVICE" .config || true
            exit 1
          fi
          echo "✅ 配置已加载"
          grep "CONFIG_TARGET_DEVICE" .config || true

      # 情况二：SSH 模式，在 SSH 后检查 manual 配置是否存在，若存在则复制并编译，否则提示用户
      - name: 加载配置并编译（SSH 模式）
        if: ${{inputs.ssh == true}}
        working-directory: openWRT
        run: |
          if [ -f ../ax3000t-manual.config ]; then
            echo "✅ 使用手动生成的配置 ax3000t-manual.config"
            cp ../ax3000t-manual.config .config
            make defconfig
            if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
              echo "❌ 配置验证失败：设备未选中"
              exit 1
            fi
            echo "✅ 配置已加载，开始编译"
            if [ "${{inputs.multithreading}}" == "true" ]; then
              make VERSION_NUMBER="24.10.6" -j$(nproc) V=s
            else
              make VERSION_NUMBER="24.10.6" -j1 V=s
            fi
          else
            echo "========================================="
            echo "⚠️ 未检测到 ax3000t-manual.config"
            echo "请在 SSH 中执行以下命令生成配置："
            echo ""
            echo "  cd openWRT"
            echo "  make menuconfig"
            echo "  # 选择设备后保存退出"
            echo "  make defconfig"
            echo "  cp .config ../ax3000t-manual.config"
            echo ""
            echo "然后重新触发工作流（不勾选 SSH）即可自动编译"
            echo "========================================="
            exit 1
          fi

      # ========== 编译（仅非 SSH 模式执行，因为 SSH 模式已在上面编译） ==========
      - name: 多线程编译 openWRT（非 SSH 模式）
        if: ${{inputs.multithreading == true && inputs.ssh == false}}
        working-directory: openWRT
        run: make VERSION_NUMBER="24.10.6" -j$(nproc) V=s

      - name: 单线程编译 openWRT（非 SSH 模式）
        if: ${{inputs.multithreading == false && inputs.ssh == false}}
        working-directory: openWRT
        run: make VERSION_NUMBER="24.10.6" -j1 V=s

      # ========== 上传产物（所有模式统一） ==========
      - name: 上传编译结果到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_mt798x_24.10.6_AX3000T
          path: openWRT/bin/targets
