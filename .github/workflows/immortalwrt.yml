          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/*
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          sudo docker system prune -af --volumes || true
          sudo dpkg --configure -a
          sudo apt --fix-broken install -y
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-distutils python3-setuptools python3-pyelftools \
            rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev \
            || { sudo apt --fix-broken install -y; sudo apt install -y --no-install-recommends build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev; }
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*

      - name: 克隆仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
