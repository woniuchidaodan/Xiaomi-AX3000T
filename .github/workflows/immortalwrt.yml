name: 🚀 编译 (Build) - ImmortalWrt for AX3000T

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false
      isFiles:
        description: '使用 files 大法 (Upload /files directory to OpenWRT root)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ inputs.ssh == false }}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    steps:
      # ========== 磁盘空间优化 ==========
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: "Optimize Disk Space"
        uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Freeing up disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 3072
          swap-size-mb: 1
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # ========== 安装编译依赖 ==========
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      # ========== 克隆当前仓库 ==========
      - name: 克隆当前仓库
        uses: actions/checkout@v5

      # ========== 克隆 ImmortalWrt 官方仓库（固定 tag v24.10.6） ==========
      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      # ========== 校验 git 版本标签 ==========
      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      # ========== 复制自定义配置文件 ==========
      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      # ========== 如果启用 files 大法，则复制 files 目录 ==========
      - name: 复制 files 目录到固件（files 大法）
        if: ${{ inputs.isFiles == true }}
        run: |
          if [ -d "files" ]; then
            cp -r files ImmortalWrt/files
            echo "✅ files 目录已复制"
          else
            echo "⚠️ files 目录不存在，跳过"
          fi

      # ========== 运行 diy.sh（包含 UA3F + quickstart 拉取及所有定制） ==========
      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      # ========== 更新并下载 feeds ==========
      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ========== 加载 AX3000T 完整配置 ==========
      - name: 加载 AX3000T 完整配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config

          # ----- 仅关闭 CONFIG_SHADOW_PASSWORDS -----
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          # ----- 使用 oldconfig 保护全局配置 -----
          yes "" | make oldconfig

          # ----- 再次确认 CONFIG_SHADOW_PASSWORDS 保持关闭 -----
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          # ----- 设备校验 -----
          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：AX3000T‑ubootmod"
          grep "CONFIG_TARGET_DEVICE" .config || true

      # ========== 编译前上传配置（方便调试） ==========
      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      # ========== 多线程编译 ==========
      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      # ========== 单线程编译 ==========
      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      # ========== 编译后版本校验 ==========
      - name: 编译后版本校验
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== profiles.json version ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      # ========== 上传编译结果 ==========
      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.6_AX3000T
          path: ImmortalWrt/bin/targets

  # ========== SSH 调试 Job ==========
  build-ssh:
    if: ${{ inputs.ssh == true }}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-22.04
    steps:
      # ---- 磁盘优化 ----
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: "Optimize Disk Space"
        uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Freeing up disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 3072
          swap-size-mb: 1
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # ---- 安装依赖 ----
      - name: 下载编译所需的依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev

      # ---- 克隆 ----
      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 校验 git 版本标签
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== git status ===="
          git status
          echo "==== 当前 commit ===="
          git log -1 --oneline

      # ---- 复制配置文件 ----
      - name: 复制自定义配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      # ---- files 大法 ----
      - name: 复制 files 目录到固件（files 大法）
        if: ${{ inputs.isFiles == true }}
        run: |
          if [ -d "files" ]; then
            cp -r files ImmortalWrt/files
            echo "✅ files 目录已复制"
          else
            echo "⚠️ files 目录不存在，跳过"
          fi

      # ---- 运行 diy.sh ----
      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      # ---- 更新 feeds ----
      - name: 更新并下载 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ---- 加载配置 ----
      - name: 加载 AX3000T 完整配置
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          yes "" | make oldconfig

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          if ! grep -q "xiaomi_mi-router-ax3000t" .config; then
            echo "❌ 错误：设备类型未正确选中！"
            exit 1
          fi
          echo "✅ 配置已加载：AX3000T‑ubootmod"
          grep "CONFIG_TARGET_DEVICE" .config || true

      # ---- 开启 SSH（tmate） ----
      - name: 开启 SSH 服务（tmate）
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      # ---- 编译前上传配置 ----
      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      # ---- 编译 ----
      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      # ---- 校验 ----
      - name: 编译后版本校验
        working-directory: ImmortalWrt
        run: |
          echo "==== git describe ===="
          git describe
          echo "==== profiles.json version ===="
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          echo "==== openwrt_release ===="
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      # ---- 上传 ----
      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.6_AX3000T
          path: ImmortalWrt/bin/targets
