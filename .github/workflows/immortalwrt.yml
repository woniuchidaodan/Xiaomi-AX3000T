name: 🚀 编译 (Build) - ImmortalWrt  (通用设备)

on:
  workflow_dispatch:
    inputs:
      multithreading:
        description: '开启多线程编译'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境'
        type: boolean
        default: false
      isFiles:
        description: '使用 files 大法'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ inputs.ssh == false }}
    runs-on: ubuntu-22.04
    name: 🚀 编译
    steps:
      - name: Before freeing disk
        run: df -hT && df -i

      - name: Optimize Disk Space
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8.1
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Freeing up disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 6144
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: After freeing
        run: df -hT && df -i

      # ========== 修复 APT 并安装依赖 ==========
      - name: 修复 APT 并安装编译依赖
        run: |
          echo "========== 彻底清理 APT =========="
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/*
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          sudo docker system prune -af --volumes || true

          echo "========== 修复 dpkg 状态 =========="
          sudo dpkg --configure -a
          sudo apt --fix-broken install -y

          echo "========== 更新软件包列表 =========="
          sudo apt update

          echo "========== 安装编译依赖 =========="
          sudo apt install -y --no-install-recommends \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-distutils python3-setuptools python3-pyelftools \
            rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev \
            || { echo "首次安装失败，尝试修复并重试..."; sudo apt --fix-broken install -y; sudo apt install -y --no-install-recommends build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools unzip wget xsltproc zlib1g-dev; }

          echo "========== 安装完成后清理 =========="
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*

      # ========== 克隆仓库 ==========
      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆 ImmortalWrt 官方仓库
        uses: actions/checkout@v5
        with:
          repository: 'immortalwrt/immortalwrt'
          ref: 'v24.10.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 校验 git 标签
        working-directory: ImmortalWrt
        run: git describe

      - name: 设置构建日期（用于 Artifact 名称）
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: 复制配置文件
        run: cp -f feeds.conf.default diy.sh seed.config ax3000t.config ImmortalWrt/

      - name: 复制 files 目录
        if: ${{ inputs.isFiles == true }}
        run: |
          if [ -d "files" ]; then
            cp -r files ImmortalWrt/files
            echo "✅ files 目录已复制"
          else
            echo "⚠️ files 目录不存在，跳过"
          fi

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新 feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 加载设备配置（通用校验）
        working-directory: ImmortalWrt
        run: |
          rm -f .config
          cp ax3000t.config .config
          grep '^CONFIG_PACKAGE_' seed.config >> .config

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          yes "" | make oldconfig

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config

          if ! grep -q "^CONFIG_TARGET_.*=y" .config; then
            echo "❌ 未选中任何目标设备"
            exit 1
          fi
          echo "✅ 目标设备："
          grep "^CONFIG_TARGET_.*=y" .config || true

      - name: 提取设备型号（不写死）
        working-directory: ImmortalWrt
        run: |
          # 从 .config 中提取 CONFIG_TARGET_DEVICE_* 的值
          DEVICE=$(grep "^CONFIG_TARGET_DEVICE_.*=y" .config | head -1 | sed -E 's/^CONFIG_TARGET_DEVICE_(.*)=y$/\1/')
          if [ -z "$DEVICE" ]; then
            DEVICE="unknown"
          fi
          echo "DEVICE_MODEL=$DEVICE" >> $GITHUB_ENV
          echo "📱 设备型号：$DEVICE"

      - name: 编译前磁盘检查
        working-directory: ImmortalWrt
        run: df -hT && df -i

      - name: 上传编译前配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 编译后校验
        working-directory: ImmortalWrt
        run: |
          git describe
          cat bin/targets/*/*/profiles.json 2>/dev/null | grep version_number || echo "profiles.json 未找到"
          cat package/base-files/files/etc/openwrt_release 2>/dev/null || echo "openwrt_release 未找到"

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_24.10.6_${{ env.BUILD_DATE }}_石健_${{ env.DEVICE_MODEL }}
          path: ImmortalWrt/bin/targets

  # ========== SSH 调试 Job ==========
  build-ssh:
    if: ${{ inputs.ssh == true }}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (SSH)
